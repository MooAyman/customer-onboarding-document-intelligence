[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egyid"
version = "0.1.0"
description = "Egyptian National ID document intelligence pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "rapidocr[rtl]>=3.10.0",
    "onnxruntime>=1.20.0",
    "numpy>=1.26.0,<3.0.0",
    "opencv-python-headless>=4.10.0,<5",
    "Pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
egyid = "egyid.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "ocr: tests that load the real OCR engine",
]
